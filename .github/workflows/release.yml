name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    # Releases come from the repository named in package.json.
    if: github.repository == 'aleluman/trama'
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.npm.outputs.published }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check that the tag matches the package version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      # A staged version is not public until it is approved, so this check does not see it. A rerun before
      # approval stages again, and npm rejects it because the staged version reserves its number.
      - name: Check whether the version is already on npm
        id: npm
        run: |
          if npm view "trama-forms@$(node -p 'require("./package.json").version')" version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - run: pnpm run check
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: trama-forms-*.tgz
      # pnpm run check builds the guide, with relative asset paths, in .artifacts/site.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .artifacts/site

  stage:
    needs: check
    if: needs.check.outputs.published == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing: npm authenticates only this job through OIDC, with no stored token.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      # Staged publishing needs npm 11.15.0 or later.
      - run: npm install --global npm@^11.15.0
      - uses: actions/download-artifact@v4
        with:
          name: package
      # The trusted publisher is stage-only: the version stays private until a maintainer approves it on npmjs.com
      # with two-factor authentication. --provenance fails the job instead of staging a version without an attestation.
      - run: npm stage publish ./trama-forms-*.tgz --provenance

  guide:
    needs: [check, stage]
    # The published guide documents the version on npm. It is not deployed if staging fails, and it is deployed
    # again when the workflow runs for a version that is already on npm.
    if: ${{ !cancelled() && needs.check.result == 'success' && (needs.stage.result == 'success' || needs.stage.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # The github-pages environment accepts only v* tags.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
