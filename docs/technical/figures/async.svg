<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 530" role="img" aria-labelledby="async-title async-desc"><title id="async-title">Sequence with out-of-order responses. Editing A starts generation 1. Editing B invalidates 1 and starts 2. B is accepted and A is discarded even if the transport cannot be aborted.</title><desc id="async-desc">Sequence with out-of-order responses. Editing A starts generation 1. Editing B invalidates 1 and starts 2. B is accepted and A is discarded even if the transport cannot be aborted.</desc><defs><marker id="arrow-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"></path></marker></defs><g class="node "><rect x="34" y="15" width="178" height="53" rx="3"></rect><text class="node-title" x="48" y="40">User / UI</text></g><g class="node blue"><rect x="337" y="15" width="186" height="53" rx="3"></rect><text class="node-title" x="351" y="40">Session / runtime</text></g><g class="node "><rect x="652" y="15" width="178" height="53" rx="3"></rect><text class="node-title" x="666" y="40">Loader</text></g><path class="lifeline" d="M 123 68 V 495"></path><path class="lifeline" d="M 430 68 V 495"></path><path class="lifeline" d="M 741 68 V 495"></path><path class="edge" d="M 123 112 H 430" marker-end="url(#arrow-async)"></path><text class="edge-label" x="170" y="102">edit account = A</text><path class="edge" d="M 430 161 H 741" marker-end="url(#arrow-async)"></path><text class="edge-label" x="470" y="149">query A · generation 1</text><path class="edge" d="M 123 217 H 430" marker-end="url(#arrow-async)"></path><text class="edge-label" x="170" y="207">edit account = B</text><g class="node blue"><rect x="327" y="237" width="206" height="59" rx="3"></rect><text class="node-title" x="341" y="262">Invalidate generation 1</text></g><path class="edge" d="M 430 321 H 741" marker-end="url(#arrow-async)"></path><text class="edge-label" x="470" y="309">query B · generation 2</text><path class="edge dashed" d="M 741 375 H 430" marker-end="url(#arrow-async)"></path><text class="edge-label" x="481" y="363">result B · current</text><path class="edge" d="M 430 416 H 123" marker-end="url(#arrow-async)"></path><text class="edge-label" x="160" y="404">publish consistent snapshot</text><path class="edge dashed" d="M 741 466 H 430" marker-end="url(#arrow-async)"></path><text class="edge-label" x="481" y="454">result A · stale</text><text class="warning" x="448" y="490">discard without writing</text><text class="edge-label" x="33" y="519">Clearing selection A, resetting, or editing the field that declares the query also invalidates the generation. Editing a target discards the response.</text></svg>
